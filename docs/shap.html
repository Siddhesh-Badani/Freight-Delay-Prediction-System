<div class="page-header">
  <div class="label">SHAP Interpretation</div>
  <h1>Feature Analysis</h1>
  <p>Five plots from the gradient-boosted model. SHAP values are computed on a 1,000-record sample from the 2024 test set using TreeExplainer with a background sample drawn from training data.</p>
</div>

<main>

  <figure>
    <div class="fig-body">
      <img src="assets/shap_summary.png" alt="SHAP beeswarm summary plot">
    </div>
    <figcaption>
      <div class="plot-number">Plot 1 of 5</div>
      <div class="cap-title">Beeswarm Summary</div>
      <p>Each dot is one shipment from the 2024 test sample. Position on the x-axis shows how much that feature pushed the prediction toward or away from a delay. Color encodes feature value (red = high, blue = low). Features are sorted by mean absolute SHAP impact. Vessel utilization and the utilization-by-congestion interaction dominate the top.</p>
    </figcaption>
  </figure>

  <figure>
    <div class="fig-body">
      <img src="assets/shap_bar.png" alt="SHAP mean absolute value bar chart">
    </div>
    <figcaption>
      <div class="plot-number">Plot 2 of 5</div>
      <div class="cap-title">Mean Absolute SHAP Values</div>
      <p>The average magnitude of each feature's SHAP contribution across all 1,000 test records. This is a cleaner summary than the beeswarm when comparing overall feature importance. The top five are vessel_utilization_pct, util_x_dest_congestion, carrier_ontime_rate_30d, carrier_reliability_score and dest_congestion_trend_7d. Dynamic rolling signals outrank static vessel or route attributes.</p>
    </figcaption>
  </figure>

  <figure>
    <div class="fig-body">
      <img src="assets/shap_waterfall_true_positive.png" alt="SHAP waterfall for a true positive prediction">
    </div>
    <figcaption>
      <div class="plot-number">Plot 3 of 5</div>
      <div class="cap-title">Waterfall: True Positive</div>
      <p>A shipment the model correctly predicted as delayed, which did in fact arrive late. Each bar shows one feature's additive contribution from the base value (average model output across the training set). Red bars push the prediction higher toward delay. Blue bars push it lower. The final predicted probability lands above the 0.15 threshold for this shipment.</p>
    </figcaption>
  </figure>

  <figure>
    <div class="fig-body">
      <img src="assets/shap_waterfall_false_positive.png" alt="SHAP waterfall for a false positive prediction">
    </div>
    <figcaption>
      <div class="plot-number">Plot 4 of 5</div>
      <div class="cap-title">Waterfall: False Positive</div>
      <p>A shipment the model predicted as delayed but which arrived on time. The features suggest genuine delay risk: high utilization, elevated destination congestion, a weak carrier 30-day rate. The ship happened to arrive on time despite those signals. At a threshold of 0.15, the model is intentionally aggressive: it catches 85% of real delays at the cost of more false alarms like this one.</p>
    </figcaption>
  </figure>

  <figure>
    <div class="fig-body">
      <img src="assets/shap_waterfall_true_negative.png" alt="SHAP waterfall for a true negative prediction">
    </div>
    <figcaption>
      <div class="plot-number">Plot 5 of 5</div>
      <div class="cap-title">Waterfall: True Negative</div>
      <p>A shipment the model correctly predicted as on time, which did arrive on time. Here the feature contributions work in the opposite direction: a reliable carrier, low destination congestion and moderate vessel utilization all push the prediction below the threshold. This shows the model has learned that conditions genuinely reduce delay risk, not just that certain routes are always safe.</p>
    </figcaption>
  </figure>
